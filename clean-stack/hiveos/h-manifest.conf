# HiveOS custom miner manifest for matador-miner.
# https://github.com/vanities/matador-miner

# The name of the miner (must match the folder inside the tar.gz and the
# "Miner name" field in the HiveOS flight sheet).
MINER_NAME=matador-miner

# Package version. Stamped by build-hiveos-pkg.sh at package time.
CUSTOM_MINER_VER=0.0.0

# Full path to the generated miner config (arg line written by h-config.sh).
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/${MINER_NAME}/${MINER_NAME}.conf

# Full path to log file basename. REQUIRED BY HIVEOS.
CUSTOM_LOG_BASENAME=/var/log/miner/custom/custom
MINER_LOG_BASENAME=/var/log/miner/${MINER_NAME}/${MINER_NAME}

# Status API base port. Child miner processes on multi GPU rigs listen on
# CUSTOM_API_PORT + gpu_index (4060, 4061, ...). h-stats.sh aggregates them.
CUSTOM_API_PORT=4060
